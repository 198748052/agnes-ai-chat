services:
  agnes-server:
    build: .
    image: agnes-server:latest
    container_name: agnes-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      JWT_SECRET: "${JWT_SECRET:-please-change-me-to-a-long-random-string}"
      TOKEN_EXPIRE_MINUTES: "${TOKEN_EXPIRE_MINUTES:-43200}"
      USERS_FILE: "data/users.json"
      USAGE_FILE: "data/usage.json"
      UPLOADS_DIR: "uploads"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
